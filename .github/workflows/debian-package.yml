name: Debian package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify bundle on Debian 12
        run: |
          docker build -f packaging/deb/Dockerfile -t piksel-atolyesi-deb .
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/output" piksel-atolyesi-deb /bin/sh -c 'cp /src/dist/*.deb /output/'
      - uses: actions/upload-artifact@v4
        with:
          name: piksel-atolyesi-debian-amd64
          path: dist/*.deb
          if-no-files-found: error
  install:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: piksel-atolyesi-debian-amd64
          path: packages
      - name: Install, check offscreen and X11, preserve data after uninstall
        env:
          DEBIAN_VERSION: ${{ matrix.debian }}
        run: |
          docker run --rm -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD/packages:/packages:ro" "debian:$DEBIAN_VERSION" /bin/sh -ec '
              apt-get update -qq
              apt-get install -y --no-install-recommends /packages/*.deb xvfb python3 fonts-dejavu-core
              QT_QPA_PLATFORM=offscreen timeout 120s piksel-atolyesi --smoke-test --data-dir /tmp/piksel-offscreen
              Xvfb :99 -screen 0 1440x1000x24 -ac -nolisten tcp &
              display_pid=$!
              trap "kill $display_pid" EXIT
              sleep 2
              DISPLAY=:99 QT_QPA_PLATFORM=xcb QT_DEBUG_PLUGINS=1 timeout 120s piksel-atolyesi --smoke-test --data-dir /tmp/piksel-x11
              python3 -c '\''import sqlite3; c=sqlite3.connect("/tmp/piksel-x11/progress.sqlite3"); assert c.execute("SELECT COUNT(*) FROM paintings").fetchone()[0] == 900'\''
              apt-get remove -y piksel-atolyesi
              test -f /tmp/piksel-x11/progress.sqlite3
            '
