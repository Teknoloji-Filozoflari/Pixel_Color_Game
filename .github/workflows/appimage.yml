name: AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build x86_64 AppImage
    # Build on the older supported LTS so the generated glibc requirement stays
    # compatible with a wider range of Linux distributions.
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE_VERSION=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$PACKAGE_VERSION"

      - name: Install build dependencies
        run: |
          # Qt loads the host's EGL/OpenGL driver interface at runtime. AppImages
          # intentionally do not bundle hardware-specific graphics drivers.
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libx11-6 libx11-xcb1 libxcb1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-randr0 libxcb-render0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
          python -m pip install --upgrade pip
          python -m pip install -c packaging/constraints-linux.txt ".[dev]" PyInstaller
          python -m ruff check src tests run.py packaging/build_bundle.py packaging/build_rpm.py
          python -m pytest -q

      - name: Download and verify versioned AppImage tools
        shell: bash
        run: |
          set -euo pipefail
          download_asset() {
            local repository=$1 tag=$2 asset=$3 output=$4 metadata url digest
            metadata=$(curl --fail --location --retry 3 \
              "https://api.github.com/repos/$repository/releases/tags/$tag")
            url=$(jq -r --arg asset "$asset" \
              '.assets[] | select(.name == $asset) | .browser_download_url' \
              <<<"$metadata")
            digest=$(jq -r --arg asset "$asset" \
              '.assets[] | select(.name == $asset) | .digest' \
              <<<"$metadata")
            test -n "$url" && test "$url" != null
            test "${digest#sha256:}" != "$digest"
            curl --fail --location --retry 3 --output "$output" "$url"
            echo "${digest#sha256:}  $output" | sha256sum --check --strict
          }
          download_asset AppImage/appimagetool 1.9.1 \
            appimagetool-x86_64.AppImage $RUNNER_TEMP/appimagetool-x86_64.AppImage
          download_asset AppImage/type2-runtime 20251108 \
            runtime-x86_64 $RUNNER_TEMP/runtime-x86_64
          chmod +x $RUNNER_TEMP/appimagetool-x86_64.AppImage
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          APPIMAGE_RUNTIME: ${{ runner.temp }}/runtime-x86_64
        run: packaging/appimage/build-appimage.sh

      - name: Smoke test packaged application
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          APPIMAGE=$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$APPIMAGE"
          "$APPIMAGE" --smoke-test --data-dir "$RUNNER_TEMP/piksel-atolyesi-smoke"

      - name: Create checksum
        working-directory: dist
        run: sha256sum ./*.AppImage > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: piksel-atolyesi-appimage-x86_64
          path: |
            dist/*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Add files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/SHA256SUMS

  install:
    needs: build-appimage
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: piksel-atolyesi-appimage-x86_64
          path: packages
      - name: Open packaged Qt X11 window with complete collection
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes xvfb libegl1 libgl1 libfontconfig1 libxkbcommon-x11-0
          package=$(find "$PWD/packages" -name '*.AppImage' -print -quit)
          chmod +x "$package"
          Xvfb :99 -screen 0 1440x1000x24 -ac -nolisten tcp &
          display_pid=$!
          trap 'kill "$display_pid"' EXIT
          sleep 2
          APPIMAGE_EXTRACT_AND_RUN=1 DISPLAY=:99 QT_QPA_PLATFORM=xcb QT_DEBUG_PLUGINS=1 timeout 120s "$package" --smoke-test --data-dir /tmp/piksel-x11
          python3 -c 'import sqlite3; c=sqlite3.connect("/tmp/piksel-x11/progress.sqlite3"); assert c.execute("SELECT COUNT(*) FROM paintings").fetchone()[0] == 900'
