name: AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build x86_64 AppImage
    # Build on the older supported LTS so the generated glibc requirement stays
    # compatible with a wider range of Linux distributions.
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE_VERSION=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$PACKAGE_VERSION"

      - name: Install build dependencies
        run: |
          # Qt loads the host's EGL/OpenGL driver interface at runtime. AppImages
          # intentionally do not bundle hardware-specific graphics drivers.
          sudo apt-get update
          sudo apt-get install --yes libegl1
          python -m pip install --upgrade pip
          python -m pip install . "PyInstaller>=6.16,<7"

      - name: Download appimagetool
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/runtime-x86_64" \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          chmod +x "$RUNNER_TEMP/appimagetool-x86_64.AppImage"

      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          APPIMAGE_RUNTIME: ${{ runner.temp }}/runtime-x86_64
        run: packaging/appimage/build-appimage.sh

      - name: Smoke test packaged application
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          APPIMAGE=$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$APPIMAGE"
          "$APPIMAGE" --smoke-test --data-dir "$RUNNER_TEMP/piksel-atolyesi-smoke"

      - name: Create checksum
        working-directory: dist
        run: sha256sum ./*.AppImage > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: piksel-atolyesi-appimage-x86_64
          path: |
            dist/*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Add files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/SHA256SUMS
