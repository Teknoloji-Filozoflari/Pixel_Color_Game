name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      appimage_run:
        description: Successful AppImage build and install run ID
        required: true
        type: string
      deb_run:
        description: Successful DEB build and install run ID
        required: true
        type: string
      rpm_run:
        description: Successful RPM build and install run ID
        required: true
        type: string
      snap_run:
        description: Successful Snap build and install run ID
        required: true
        type: string
      nix_run:
        description: Successful Nix build and smoke run ID
        required: true
        type: string
      windows_run:
        description: Successful Windows EXE build and install run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-verified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require successful package checks
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE_RUN: ${{ inputs.appimage_run }}
          DEB_RUN: ${{ inputs.deb_run }}
          RPM_RUN: ${{ inputs.rpm_run }}
          SNAP_RUN: ${{ inputs.snap_run }}
          NIX_RUN: ${{ inputs.nix_run }}
          WINDOWS_RUN: ${{ inputs.windows_run }}
        shell: bash
        run: |
          python packaging/verify_release_runs.py
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.appimage_run }}
          name: piksel-atolyesi-appimage-x86_64
          github-token: ${{ github.token }}
          path: verified/appimage
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.deb_run }}
          name: piksel-atolyesi-debian-amd64
          github-token: ${{ github.token }}
          path: verified/deb
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.rpm_run }}
          name: piksel-atolyesi-rpm-x86_64
          github-token: ${{ github.token }}
          path: verified/rpm
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.snap_run }}
          name: piksel-atolyesi-snap-amd64
          github-token: ${{ github.token }}
          path: verified/snap
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.windows_run }}
          name: piksel-atolyesi-windows-x64
          github-token: ${{ github.token }}
          path: verified/windows
      - name: Verify package checksums before combining assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          for directory in verified/*; do
            (cd "$directory" && sha256sum --check --strict SHA256SUMS)
            while IFS= read -r -d '' package; do
              name=$(basename "$package")
              test ! -e "release-assets/$name"
              cp "$package" "release-assets/$name"
            done < <(find "$directory" -maxdepth 1 -type f ! -name SHA256SUMS -print0)
          done
      - name: Build clean Python and source packages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build --outdir release-assets
          python packaging/build_release.py
          cp dist/*-source.zip release-assets/
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test -f "docs/release-notes/v$version.md"
          test -f "release-assets/Piksel-Atolyesi-$version-x86_64.AppImage"
          test -f "release-assets/piksel-atolyesi_${version}-1_amd64.deb"
          test -f "release-assets/piksel-atolyesi-$version-1.fc43.x86_64.rpm"
          test -f "release-assets/piksel-atolyesi_${version}_amd64.snap"
          test -f "release-assets/Piksel-Atolyesi-$version-Setup-x64.exe"
          test -f "release-assets/piksel-atolyesi-$version-windows-x64.zip"
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheel = next(Path("release-assets").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              assert len([name for name in archive.namelist() if name.endswith(".pcolor")]) == 900
          PY
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          gh release create "v$version" --target "$GITHUB_SHA" --draft \
            --title "Piksel Atölyesi v$version" --notes-file "docs/release-notes/v$version.md" \
            release-assets/*
          gh release edit "v$version" --draft=false --latest
