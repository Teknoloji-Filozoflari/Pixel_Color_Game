name: Python package

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install ".[dev]"
      - name: Test
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short > pytest-output.txt 2>&1
          result=$?
          cat pytest-output.txt
          if [ "$result" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          output = Path('pytest-output.txt').read_text(encoding='utf-8', errors='replace')
          summary = output[-3000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Python test failure::{summary}')
          PY
          fi
          exit "$result"
      - name: Verify release sources
        run: python packaging/build_release.py
