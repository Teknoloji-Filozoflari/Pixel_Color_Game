name: Python package

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pin Ubuntu: ubuntu-latest (26.04) has been failing apt DNS to mirrors.
        os: [ubuntu-24.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux graphics runtime
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install --yes libegl1 && exit 0
            echo "apt install failed (attempt $attempt); retrying..."
            sleep $((attempt * 5))
          done
          exit 1
      - name: Install dependencies
        run: python -m pip install ".[dev]"
      - name: Test
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short > pytest-output.txt 2>&1
          result=$?
          cat pytest-output.txt
          if [ "$result" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          output = Path('pytest-output.txt').read_text(encoding='utf-8', errors='replace')
          failures = [line for line in output.splitlines() if line.startswith(('FAILED ', 'ERROR '))]
          summary = ('\n'.join(failures) or output[-3000:])[:3000]
          summary = summary.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Python test failure::{summary}')
          PY
          fi
          exit "$result"
      - name: Lint
        run: python -m ruff check src tests run.py packaging/build_bundle.py packaging/build_release.py packaging/build_windows.py packaging/build_macos.py packaging/windows/smoke_test.py packaging/macos/smoke_test.py packaging/verify_release_runs.py
      - name: Verify release sources
        run: python packaging/build_release.py
