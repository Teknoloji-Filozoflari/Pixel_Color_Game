name: macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -c requirements-tested.txt ".[dev]" PyInstaller==6.22.3
      - name: Lint packaging entry points
        run: python -m ruff check src tests run.py packaging/build_bundle.py packaging/build_release.py packaging/build_windows.py packaging/build_macos.py packaging/windows/smoke_test.py packaging/macos/smoke_test.py packaging/verify_release_runs.py
      - name: Test
        run: python -m pytest -q
      - name: Build macOS app and ZIP
        run: python packaging/build_macos.py
      - name: Verify packaged app startup
        run: python packaging/macos/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: piksel-atolyesi-macos-${{ matrix.arch }}
          path: |
            dist/*-macos-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
