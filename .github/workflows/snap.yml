name: Snap package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt runtime and build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libx11-6 libx11-xcb1 libxcb1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-randr0 libxcb-render0 libxcb-shm0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
          python -m pip install -c packaging/constraints-linux.txt '.[dev]' PyInstaller
      - name: Quality and bundle checks
        run: |
          python -m ruff check src tests run.py packaging/build_bundle.py packaging/build_rpm.py
          python -m pytest -q
          python packaging/build_bundle.py
          tar -C build/bundle -czf bundle.tar.gz piksel-atolyesi
      - uses: actions/upload-artifact@v4
        with:
          name: piksel-snap-bundle
          path: bundle.tar.gz
          if-no-files-found: error
  build:
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: piksel-snap-bundle
      - name: Restore verified bundle
        run: |
          mkdir -p build/bundle
          tar -C build/bundle -xzf bundle.tar.gz
      - uses: canonical/action-build@v1
        id: snapcraft
      - uses: actions/upload-artifact@v4
        with:
          name: piksel-atolyesi-snap-amd64
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
  install:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: piksel-atolyesi-snap-amd64
          path: packages
      - name: Install strict Snap and open X11 window
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes xvfb
          package=$(find "$PWD/packages" -name '*.snap' -print -quit)
          sudo snap install --dangerous "$package"
          sudo snap connect piksel-atolyesi:x11
          QT_QPA_PLATFORM=offscreen timeout 120s snap run piksel-atolyesi --smoke-test
          Xvfb :99 -screen 0 1440x1000x24 -ac -nolisten tcp &
          display_pid=$!
          trap 'kill "$display_pid"' EXIT
          sleep 2
          DISPLAY=:99 QT_QPA_PLATFORM=xcb QT_DEBUG_PLUGINS=1 timeout 120s snap run piksel-atolyesi --smoke-test
          python3 -c 'import sqlite3; from pathlib import Path; c=sqlite3.connect(Path.home()/"snap/piksel-atolyesi/common/data/PixelColoring/PikselAtolyesi/progress.sqlite3"); assert c.execute("SELECT COUNT(*) FROM paintings").fetchone()[0] == 900'
