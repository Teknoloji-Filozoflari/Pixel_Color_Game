name: piksel-atolyesi
version: '0.16.1'
base: core24
summary: Çevrim dışı piksel boyama oyunu
description: |
  900 hazır resim, yedi zorluk seviyesi, kendi görsellerini ekleme ve
  otomatik kayıt ile Türkçe numaraya göre boyama oyunu.
grade: devel
confinement: strict
license: MIT
platforms:
  amd64:

apps:
  piksel-atolyesi:
    command: bin/piksel-atolyesi
    desktop: usr/share/applications/io.github.teknolojifilozoflari.PixelColorGame.desktop
    plugs: [desktop, desktop-legacy, wayland, x11, opengl, home]
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu:$SNAP/lib/x86_64-linux-gnu
      FONTCONFIG_PATH: $SNAP/etc/fonts
      FONTCONFIG_FILE: $SNAP/etc/fonts/fonts.conf

parts:
  game:
    plugin: dump
    source: build/bundle/piksel-atolyesi
    organize:
      _internal: usr/lib/piksel-atolyesi/_internal
      piksel-atolyesi: usr/lib/piksel-atolyesi/piksel-atolyesi
    stage-packages:
      - libegl1
      - libgl1
      - libgl1-mesa-dri
      - libglib2.0-0t64
      - libfontconfig1
      - fonts-dejavu-core
      - libdbus-1-3
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-randr0
      - libxcb-render0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-xfixes0
      - libxcb-xinerama0
      - libxcb-xkb1
      - libxkbcommon0
      - libxkbcommon-x11-0
  launcher:
    plugin: dump
    source: snap/local
    organize:
      piksel-atolyesi: bin/piksel-atolyesi
  desktop:
    plugin: nil
    source: .
    override-build: |
      install -Dm644 packaging/appimage/io.github.teknolojifilozoflari.PixelColorGame.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/io.github.teknolojifilozoflari.PixelColorGame.desktop"
      install -Dm644 src/pixel_coloring/resources/icons/piksel-atolyesi.png \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/piksel-atolyesi.png"
      install -Dm644 packaging/appimage/io.github.teknolojifilozoflari.PixelColorGame.appdata.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/io.github.teknolojifilozoflari.PixelColorGame.appdata.xml"
      install -d "$CRAFT_PART_INSTALL/usr/share/doc/piksel-atolyesi"
      cp LICENSE ASSETS_LICENSE.md THIRD_PARTY.md TELIF-VE-YAYIN-NOTU.md \
        "$CRAFT_PART_INSTALL/usr/share/doc/piksel-atolyesi/"
      cp -a LICENSES "$CRAFT_PART_INSTALL/usr/share/doc/piksel-atolyesi/"
      sed -i 's|^Icon=piksel-atolyesi$|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/piksel-atolyesi.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/io.github.teknolojifilozoflari.PixelColorGame.desktop"
